<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colégio São Cristóvão - Oficial</title>
    <style>
        :root {
            --azul-principal: #0056b3;
            --azul-escuro: #003366;
            --preto: #1a1a1a;
            --cinza-claro: #f4f4f9;
            --branco: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--cinza-claro);
            color: #333;
            scroll-behavior: smooth;
        }

        /* HEADER & NAV */
        header {
            background: linear-gradient(135deg, var(--preto) 0%, var(--azul-escuro) 100%);
            color: var(--branco);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid var(--azul-principal);
        }

        nav {
            background-color: var(--preto);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: var(--branco);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover { color: var(--azul-principal); }

        /* BOTÃO PORTAL DO ALUNO */
        .btn-portal {
            background-color: var(--azul-principal);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* SEÇÕES */
        section {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: var(--branco);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h2 { color: var(--azul-escuro); border-left: 5px solid var(--azul-principal); padding-left: 15px; }

        /* 1. SISTEMA DE ACCORDION (MATRIZ CURRICULAR) */
        .accordion {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }

        .accordion-item { border-bottom: 1px solid #ddd; }

        .accordion-header {
            background: #f8f9fa;
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            transition: 0.3s;
        }

        .accordion-header:hover { background: #e9ecef; }

        .accordion-content {
            display: none;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }

        /* 2. FORMULÁRIO DE CONTATO/INSCRIÇÃO */
        .form-grupo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-enviar {
            background: var(--azul-escuro);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-enviar:hover { background: var(--preto); }

        /* 3. MODAL DE LOGIN (PORTAL DO ALUNO) */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 20px; top: 10px;
            font-size: 28px;
            cursor: pointer;
        }

        footer { background: var(--preto); color: white; text-align: center; padding: 20px; margin-top: 40px; }
    </style>
</head>
<body>

<header>
    <h1>Colégio São Cristóvão</h1>
    <p>Tecnologia e Educação andam juntas.</p>
</header>

<nav>
    <a href="#">Início</a>
    <a href="#Cursos">Cursos</a>
    <a href="#Inscricao">Inscrição</a>
    <div class="btn-portal" onclick="abrirModal()">Portal do Aluno</div>
</nav>

<section id="Cursos">
